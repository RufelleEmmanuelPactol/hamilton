<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Proof of delivery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--panel:#FFFFFF;--line:#E4E7EC;--line2:#D0D5DD;--ink:#101828;--ink2:#344054;--mute:#667085;--sub:#F9FAFB;--brand:#E91E63;--brandInk:#C2185B;--ok:#067647;--okBg:#ECFDF3;--warn:#B54708;--warnBg:#FFFAEB;--err:#B42318;--errBg:#FEF3F2;--errLine:#FECDCA}
a{color:#C2185B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: var(--panel); color: var(--ink); font-size: 14px; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px; border-bottom: 1px solid var(--line)">
<a href="DriverRoute.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1"><div style="font-weight: 600">Complete delivery</div><div style="font-size: 12px; color: var(--mute)">#1042 · Mark Tan · Uptown Parksuites</div></div>
</header>

<ol aria-label="Steps" style="list-style: none; margin: 0; padding: 12px 18px; display: flex; gap: 8px; border-bottom: 1px solid var(--line); font-size: 12px">
<li style="flex: 1"><div style="height: 4px; border-radius: 2px; background: var(--brand)"></div><div style="margin-top: 6px; font-weight: 600; color: var(--brandInk)">1 · Photo</div></li>
<li style="flex: 1"><div style="height: 4px; border-radius: 2px; background: var(--line)"></div><div style="margin-top: 6px; color: var(--mute)">2 · Recipient</div></li>
<li style="flex: 1"><div style="height: 4px; border-radius: 2px; background: var(--line)"></div><div style="margin-top: 6px; color: var(--mute)">3 · Confirm</div></li>
</ol>

<div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<div style="position: relative; height: 300px; border-radius: 10px; overflow: hidden; background: #1D2939">
<svg viewBox="0 0 354 300" preserveAspectRatio="xMidYMid slice" style="display: block; width: 100%; height: 100%" role="img" aria-label="Blurry photo of a gift box on a lobby desk">
<defs><filter id="b"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter></defs>
<g filter="url(#b)"><rect width="354" height="300" fill="#CFC8BC"></rect><rect y="190" width="354" height="110" fill="#8E6E52"></rect><rect y="180" width="354" height="14" fill="#6E533D"></rect><rect x="125" y="120" width="104" height="64" rx="4" fill="#EFE3CC"></rect><rect x="168" y="120" width="18" height="64" fill="#C2185B"></rect><rect x="125" y="146" width="104" height="10" fill="#C2185B"></rect><rect x="40" y="140" width="56" height="38" rx="3" fill="#F7F5F0"></rect></g>
<rect x="22" y="22" width="310" height="256" rx="8" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"></rect>
</svg>
<div style="position: absolute; left: 10px; top: 10px; background: rgba(16,24,40,0.8); color: #fff; font-size: 12px; border-radius: 6px; padding: 4px 8px">Checked in 1.2s</div>
</div>

<div role="alert" style="border: 1px solid var(--errLine); background: var(--errBg); border-radius: 10px; padding: 12px 14px">
<div style="font-weight: 600; color: var(--err)">Retake needed. You&#39;re still on site.</div>
<table style="width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; color: var(--ink2)">
<tr><td style="padding: 3px 0">Image sharpness</td><td style="padding: 3px 0; text-align: right; font-weight: 600; color: var(--err)">Fail</td></tr>
<tr><td style="padding: 3px 0">Package visible</td><td style="padding: 3px 0; text-align: right; font-weight: 600; color: var(--warn)">Unclear</td></tr>
<tr><td style="padding: 3px 0">At drop-off point (GPS 12 m)</td><td style="padding: 3px 0; text-align: right; font-weight: 600; color: var(--ok)">Pass</td></tr>
</table>
<div style="font-size: 12px; color: var(--mute); margin-top: 6px">Hold steady. Fit the box and the logbook inside the frame.</div>
</div>
</div>

<div style="padding: 10px 16px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px">
<button style="font: inherit; height: 52px; border: 0; border-radius: 10px; background: var(--brandInk); color: #fff; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Retake photo</button>
<button style="font: inherit; height: 44px; border: 1px solid var(--line2); border-radius: 10px; background: var(--panel); color: var(--ink2); cursor: pointer">Can&#39;t take a clear photo</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
